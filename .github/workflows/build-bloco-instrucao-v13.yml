name: Build Bloco Instrucao V13
on:
  push:
    paths:
      - 'tools/gen_bloco_instrucao_v13.py'
      - '.github/workflows/build-bloco-instrucao-v13.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate model
        run: python tools/gen_bloco_instrucao_v13.py
      - name: Package files
        run: |
          cd models/v13
          zip -9 BlocoInstrucao_V13.zip BlocoInstrucao_V13.obj BlocoInstrucao_V13.mtl README_V13.txt
      - uses: actions/upload-artifact@v4
        with:
          name: BlocoInstrucao_V13
          path: models/v13/BlocoInstrucao_V13.zip
          if-no-files-found: error
