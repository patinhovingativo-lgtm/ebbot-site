name: Build CEFET Trainer v10

on:
  push:
    branches: [cefet-trainer-v10-source]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Finalize v0.10 source and run source checks
        run: |
          set -euxo pipefail
          python3 tools/v10_finalize.py
          grep -q "versionName '0.10.0'" cefet-trainer/app/build.gradle
          grep -q 'android:name=".V10Activity"' cefet-trainer/app/src/main/AndroidManifest.xml
          grep -q 'ExamV10Activity.class' cefet-trainer/app/src/main/java/com/cefettrainer/app/V10Activity.java
          grep -q 'Simulado CEFET — 30 questões' cefet-trainer/app/src/main/java/com/cefettrainer/app/ExamV10Activity.java
          grep -q 'Comparar leituras' cefet-trainer/app/src/main/java/com/cefettrainer/app/EssayCoachActivity.java
          echo 'Source checks passed.'

      - name: Upload final source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: CEFET-Trainer-v0.10.0-source
          path: cefet-trainer
          if-no-files-found: error

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compile APK
        run: |
          set -euxo pipefail
          cd cefet-trainer
          gradle :app:clean :app:assembleDebug --stacktrace --no-daemon

      - name: Verify package, launcher, signature and ZIP integrity
        run: |
          set -euxo pipefail
          APK="$(find cefet-trainer/app/build/outputs/apk/debug -name '*.apk' | head -1)"
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          BADGING="$($ANDROID_HOME/build-tools/35.0.0/aapt dump badging "$APK")"
          echo "$BADGING" | head -20
          echo "$BADGING" | grep -q "package: name='com.cefettrainer.app'"
          echo "$BADGING" | grep -q "versionName='0.10.0'"
          echo "$BADGING" | grep -q "launchable-activity: name='com.cefettrainer.app.V10Activity'"
          $ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose "$APK"
          sha256sum "$APK" | tee CEFET_Trainer_v0.10.0.sha256
          cp "$APK" CEFET_Trainer_v0.10.0.apk

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: CEFET-Trainer-v0.10.0
          path: |
            CEFET_Trainer_v0.10.0.apk
            CEFET_Trainer_v0.10.0.sha256
          if-no-files-found: error
