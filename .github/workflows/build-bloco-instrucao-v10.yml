name: Build Bloco Instrucao V10
on:
  push:
    paths:
      - 'tools/gen_bloco_instrucao_v10.py'
      - '.github/workflows/build-bloco-instrucao-v10.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate model
        run: python tools/gen_bloco_instrucao_v10.py
      - name: Package files
        run: |
          cd models/v10
          zip -9 BlocoInstrucao_V10.zip BlocoInstrucao_V10.obj BlocoInstrucao_V10.mtl README_V10.txt
      - uses: actions/upload-artifact@v4
        with:
          name: BlocoInstrucao_V10
          path: models/v10/BlocoInstrucao_V10.zip
          if-no-files-found: error
