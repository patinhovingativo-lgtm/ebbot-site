name: Build Bloco Instrucao V12
on:
  push:
    paths:
      - 'tools/gen_bloco_instrucao_v12.py'
      - '.github/workflows/build-bloco-instrucao-v12.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate model
        run: python tools/gen_bloco_instrucao_v12.py
      - name: Package files
        run: |
          cd models/v12
          zip -9 BlocoInstrucao_V12.zip BlocoInstrucao_V12.obj BlocoInstrucao_V12.mtl README_V12.txt
      - uses: actions/upload-artifact@v4
        with:
          name: BlocoInstrucao_V12
          path: models/v12/BlocoInstrucao_V12.zip
          if-no-files-found: error
