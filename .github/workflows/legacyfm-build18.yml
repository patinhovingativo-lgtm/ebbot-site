name: LegacyFM Build 18 Asset Pipeline

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build asset package
        run: |
          set -euxo pipefail
          mkdir -p out/models out/vendor
          curl -fL --retry 3 https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Assets/main/Models/RiggedFigure/glTF-Binary/RiggedFigure.glb -o out/models/RiggedFigure.glb
          curl -fL --retry 3 https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Assets/main/Models/CesiumMan/glTF-Binary/CesiumMan.glb -o out/models/CesiumMan.glb
          curl -fL --retry 3 https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js -o out/vendor/three.min.js
          curl -fL --retry 3 https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js -o out/vendor/GLTFLoader.js
          file out/models/*.glb out/vendor/*.js
          sha256sum out/models/*.glb out/vendor/*.js > out/SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: legacyfm-build18-assets
          path: out/
          if-no-files-found: error
          retention-days: 1
