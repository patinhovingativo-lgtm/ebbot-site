name: LegacyFM Build 18 Asset Pipeline

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Environment diagnostics
        run: |
          set -euxo pipefail
          python3 --version
          curl --version | head -n 1
          mkdir -p out
          printf 'LegacyFM pipeline running\n' > out/diagnostic.txt
          curl -fL --retry 3 https://threejs.org/examples/models/gltf/Xbot.glb -o out/Xbot.glb
          file out/Xbot.glb
          du -h out/Xbot.glb
      - name: Upload diagnostic artifact
        uses: actions/upload-artifact@v4
        with:
          name: legacyfm-build18-diagnostic
          path: out/
          if-no-files-found: error
          retention-days: 1
