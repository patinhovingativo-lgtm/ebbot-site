name: Build CEFET Trainer v9 Focus

on:
  push:
    branches: [cefet-trainer-v9-focus2e-final]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct v8 source payload
        run: |
          set -euxo pipefail
          cat cefet-v8-final-payload/chunk*.b64 | tr -d '\r\n ' > /tmp/cefet-v8.b64
          base64 -d /tmp/cefet-v8.b64 > /tmp/cefet-v8.tar.gz
          gzip -t /tmp/cefet-v8.tar.gz
          mkdir -p cefet-v9-build
          tar -xzf /tmp/cefet-v8.tar.gz -C cefet-v9-build
          echo '--- source files ---'
          find cefet-v9-build -maxdepth 5 -type f | sort | head -200

      - name: Upload reconstructed source
        uses: actions/upload-artifact@v4
        with:
          name: CEFET-Trainer-v9-source-before-focus-patch
          path: cefet-v9-build
          if-no-files-found: error

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Find Android project and build
        run: |
          set -euxo pipefail
          PROJECT="$(dirname "$(find cefet-v9-build -name settings.gradle -o -name settings.gradle.kts | head -1)")"
          test -n "$PROJECT"
          echo "PROJECT=$PROJECT" >> "$GITHUB_ENV"
          cd "$PROJECT"
          gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify APK
        run: |
          set -euxo pipefail
          APK="$(find "$PROJECT" -path '*/app/build/outputs/apk/debug/*.apk' | head -1)"
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          sha256sum "$APK"
          cp "$APK" CEFET_Trainer_v0.9.0_Focus2E.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CEFET-Trainer-v0.9.0-Focus2E
          path: CEFET_Trainer_v0.9.0_Focus2E.apk
          if-no-files-found: error
