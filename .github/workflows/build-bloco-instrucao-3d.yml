name: Build Bloco Instrucao 3D

on:
  push:
    branches:
      - generated/bloco-instrucao-3d
    paths:
      - 'tools/generate_bloco_instrucao_3d.py'
      - '.github/workflows/build-bloco-instrucao-3d.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-model:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: generated/bloco-instrucao-3d

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate OBJ master model
        run: python tools/generate_bloco_instrucao_3d.py

      - name: Validate OBJ syntax and indices
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          root=Path('generated/bloco_instrucao_3d')
          obj=root/'Bloco_Instrucao_3D.obj'
          checks=json.loads((root/'checks.json').read_text())
          vertices=0
          faces=0
          bad=[]
          for ln,line in enumerate(obj.read_text().splitlines(),1):
              if line.startswith('v '):
                  vertices += 1
              elif line.startswith('f '):
                  faces += 1
                  for tok in line.split()[1:]:
                      idx=int(tok.split('/')[0])
                      if idx < 1 or idx > vertices:
                          bad.append((ln,idx,vertices))
          assert checks['PASS'], checks
          assert checks['rooms_total']==16
          assert checks['rooms_per_floor']=={'1':8,'2':8}
          assert checks['corridor_classroom_windows']==0
          assert checks['chairs_total']==16
          assert vertices == checks['obj_vertices'], (vertices, checks['obj_vertices'])
          assert faces == checks['obj_faces'], (faces, checks['obj_faces'])
          assert not bad, bad[:10]
          assert vertices > 500 and faces > 300
          print('VALID MODEL')
          print('vertices:', vertices)
          print('faces:', faces)
          print('rooms:', checks['rooms_total'])
          print('building:', checks['building_size'])
          PY

      - name: Commit generated model back to branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add generated/bloco_instrucao_3d
          if git diff --cached --quiet; then
            echo "No generated changes"
          else
            git commit -m "Generate validated Bloco Instrucao 3D OBJ"
            git push origin HEAD:generated/bloco-instrucao-3d
          fi
