name: Build Bloco Instrucao V5
on:
  push:
    paths:
      - 'tools/gen_bloco_instrucao_v5.py'
      - '.github/workflows/build-bloco-instrucao-v5.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate model
        run: python tools/gen_bloco_instrucao_v5.py
      - name: Package files
        run: |
          cd models/v5
          zip -9 BlocoInstrucao_V5.zip BlocoInstrucao_V5.obj BlocoInstrucao_V5.mtl
      - uses: actions/upload-artifact@v4
        with:
          name: BlocoInstrucao_V5
          path: models/v5/BlocoInstrucao_V5.zip
          if-no-files-found: error
