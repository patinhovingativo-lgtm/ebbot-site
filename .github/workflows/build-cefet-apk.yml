name: Build CEFET Trainer v7 APK

on:
  push:
    branches: [cefet-trainer-v6-edital]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct v7 project
        run: |
          rm -rf cefet-v7-build
          mkdir -p cefet-v7-build
          cat cefet-v7-payload/chunk*.b64 > /tmp/cefet-v7.b64
          base64 -d /tmp/cefet-v7.b64 > /tmp/cefet-v7.tar.gz
          echo "e3817997401a470775a3db4280c9a0b4c04f43680d468fd93dfbe3b409ae84f8  /tmp/cefet-v7.tar.gz" | sha256sum -c -
          tar -xzf /tmp/cefet-v7.tar.gz -C cefet-v7-build

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Compile learning and question engines
        run: |
          rm -rf /tmp/cefet-engine-classes
          mkdir -p /tmp/cefet-engine-classes
          javac -encoding UTF-8 -d /tmp/cefet-engine-classes \
            cefet-v7-build/app/src/main/java/com/cefettrainer/app/Question.java \
            cefet-v7-build/app/src/main/java/com/cefettrainer/app/Curriculum.java \
            cefet-v7-build/app/src/main/java/com/cefettrainer/app/QuestionEngine.java \
            cefet-v7-build/app/src/main/java/com/cefettrainer/app/LessonLibrary.java

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: cefet-v7-build
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify APK archive
        run: |
          test -s cefet-v7-build/app/build/outputs/apk/debug/app-debug.apk
          unzip -t cefet-v7-build/app/build/outputs/apk/debug/app-debug.apk >/dev/null
          sha256sum cefet-v7-build/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CEFET-Trainer-v0.7.0-Aprender-2027
          path: cefet-v7-build/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
