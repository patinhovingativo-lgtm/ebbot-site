name: Build CEFET Trainer v6 APK

on:
  push:
    branches: [cefet-trainer-v6-edital]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct v6 project
        run: |
          rm -rf cefet-v6-build
          mkdir -p cefet-v6-build
          cat cefet-v6-payload/chunk*.b64 > /tmp/cefet-v6.b64
          base64 -d /tmp/cefet-v6.b64 > /tmp/cefet-v6.tar.gz
          echo "8f7a42b8730e1bcc5f11136090fa5cefdcec6cf7cbb06552f5d0ca47b934a9a1  /tmp/cefet-v6.tar.gz" | sha256sum -c -
          tar -xzf /tmp/cefet-v6.tar.gz -C cefet-v6-build

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Compile question engine first
        run: |
          rm -rf /tmp/cefet-engine-classes
          mkdir -p /tmp/cefet-engine-classes
          javac -encoding UTF-8 -d /tmp/cefet-engine-classes \
            cefet-v6-build/app/src/main/java/com/cefettrainer/app/Question.java \
            cefet-v6-build/app/src/main/java/com/cefettrainer/app/Curriculum.java \
            cefet-v6-build/app/src/main/java/com/cefettrainer/app/QuestionEngine.java

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: cefet-v6-build
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify APK archive
        run: |
          test -s cefet-v6-build/app/build/outputs/apk/debug/app-debug.apk
          unzip -t cefet-v6-build/app/build/outputs/apk/debug/app-debug.apk >/dev/null
          sha256sum cefet-v6-build/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CEFET-Trainer-v0.6.0-Edital-2027
          path: cefet-v6-build/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
